[project]
name = "triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.4", "pydantic>=2", "python-dotenv", "typer", "pandas"]

[project.scripts]
triage = "triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[project.optional-dependencies]
dev = ["ipykernel"]
